[project]
name = "escalada-api"
version = "0.1.0"
description = "Escalada API (FastAPI/WebSocket) + persistence layer"
authors = [
    {name = "Silviu"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.125.0,<0.200.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "psutil (>=7.1.2,<8.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-multipart (>=0.0.26,<0.1.0)",
    "reportlab (>=4.4.0,<5.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "websockets (>=15.0.1,<16.0.0)",
    "pyjwt (>=2.12.0,<3.0.0)",
    "cryptography (>=46.0.7,<47.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[project.scripts]
escalada-server = "escalada.launcher:main"

[tool.poetry]
packages = [{ include = "escalada" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^7.0.0"
pre-commit = "^4.5.1"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
